<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Manager</title>
    <link rel="stylesheet" href="CSS/index.css">
</head>
<body>

<!--Header section-->
    <header class="site-header">
        <div class="container header-content">
            <a href="#" class="logo">TaskFlow</a>
            <p class="header-label">Personal Task Manager</p>
        </div>
    </header>

    <!-- Hero Section -->
<section class="hero container">
    <div class="hero-content">
        <p class="eyebrow">STAY ORGANIZED</p>
        <h1>
            Get things done,
            <span>one task at a time.</span>
        </h1>
        <p class="hero-text">
            Keep track of your tasks, focus on what matters,
            and make steady progress every day.
        </p>
    </div>
</section>
  
<!--Task section-->
<section class="task section-container">
    <div class="task-card">
        <div class="task-header">
       <div>
        <h2>My task</h2>
        <p class="task-subtitle">
            Manage your daily priorities.
        </p>
       </div>
       <span class="task-status">TASKS</span>
        </div>
    </div>

</section>
</body>
</html>
